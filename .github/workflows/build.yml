name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uloz pliki i usun stare
        run: |
          mkdir -p src/main/java/pl/galaxy/serca src/main/resources
          if [ -f GalaxySerca.java ]; then cp GalaxySerca.java src/main/java/pl/galaxy/serca/GalaxySerca.java; fi
          if [ -f plugin.yml ]; then cp plugin.yml src/main/resources/plugin.yml; fi
          find src/main/java -name '*.java' ! -name GalaxySerca.java -delete
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: GalaxySerca
          path: target/GalaxySerca-*.jar
