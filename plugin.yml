name: GalaxySerca
version: ${project.version}
main: pl.galaxy.serca.GalaxySerca
api-version: '1.21'
author: Galaxy
description: System serc z sklepem GUI

commands:
  wyplacserca:
    description: Wypłaca jedno serce
    aliases: [wyplacserce]
    permission: galaxyserca.withdraw
  galaxyserca-gui:
    description: Panel admina z sercami
    permission: galaxyserca.admin
  galaxyserca-reload:
    description: Przeładowuje konfigurację
    permission: galaxyserca.reload
  galaxyserca-give:
    description: Daje serca graczowi
    usage: /galaxyserca-give <normal|anarchic> [ilosc] [gracz]
    permission: galaxyserca.give
  galaxyserca-set:
    description: Ustawia liczbę serc gracza
    usage: /galaxyserca-set <gracz> <serca>
    permission: galaxyserca.admin
  galaxyserca-reset:
    description: Resetuje serca gracza lub wszystkich
    usage: /galaxyserca-reset <gracz|all>
    permission: galaxyserca.admin

permissions:
  galaxyserca.admin:
    description: Pełny dostęp admina (darmowe serca w GUI, reload, give, set, reset)
    default: op
    children:
      galaxyserca.reload: true
      galaxyserca.give: true
  galaxyserca.withdraw:
    default: true
  galaxyserca.reload:
    default: op
  galaxyserca.give:
    default: op
