name: GalaxySerca
version: ${project.version}
main: pl.galaxy.serca.GalaxySerca
api-version: '1.21'
author: Galaxy
description: System serc z sklepem GUI

commands:
  wyplacserca:
    description: Wypłaca jedno serce
    aliases: [wyplacserce, wyplac-serca]
    permission: galaxyserca.withdraw
  galaxysercagui:
    description: Panel admina z sercami
    aliases: [galaxyserca-gui, galaxysercapanel, galaxyserca-panel]
    permission: galaxyserca.admin
  galaxysercareload:
    description: Przeładowuje konfigurację
    aliases: [galaxyserca-reload, galaxysercareload]
    permission: galaxyserca.reload
  galaxysercagive:
    description: Daje serca graczowi
    aliases: [galaxyserca-give, galaxygive, galaxy-give]
    usage: /galaxysercagive <normal|anarchic> [ilosc] [gracz]
    permission: galaxyserca.give
  setserca:
    description: Ustawia liczbę serc gracza
    aliases: [set-serca, setserce]
    permission: galaxyserca.admin
  resetserca:
    description: Resetuje serca gracza lub wszystkich
    aliases: [reset-serca, resetserce, reset-sercas]
    usage: /resetserca <gracz|all>
    permission: galaxyserca.admin

permissions:
  galaxyserca.admin:
    description: Pełny dostęp admina
    default: op
    children:
      galaxyserca.reload: true
      galaxyserca.give: true
  galaxyserca.withdraw:
    default: true
  galaxyserca.reload:
    default: op
  galaxyserca.give:
    default: op
