name: GalaxySerca
version: 1.0.0
main: pl.galaxy.serca.GalaxySerca
api-version: '1.21'
author: youngmateo
description: System serc z zarzadzaniem zdrowiem
softdepend: [PlaceholderAPI]

commands:
  wyplacserca:
    description: Wypłaca serca do ekwipunku
    usage: /wyplacserca [ilosc]
    aliases: [wyplacserce]
    permission: galaxyserca.withdraw
  galaxyserca-gui:
    description: Otwiera panel zarządzania
    aliases: [panel, galaxysercagui]
    permission: galaxyserca.admin
  galaxyserca-reload:
    description: Przeładowuje konfigurację pluginu
    aliases: [galaxysercareload]
    permission: galaxyserca.reload
  galaxyserca-give:
    description: Daje serca wybranemu graczowi
    usage: /galaxyserca-give <normal|anarchic> [ilosc] [gracz]
    permission: galaxyserca.give

permissions:
  galaxyserca.admin:
    description: Dostęp do panelu administracyjnego, reload i give
    default: op
    children:
      galaxyserca.reload: true
      galaxyserca.give: true
  galaxyserca.withdraw:
    description: Pozwala wypłacać serca
    default: true
  galaxyserca.reload:
    description: Pozwala przeładować config
    default: op
  galaxyserca.give:
    description: Pozwala rozdawać serca
    default: op
