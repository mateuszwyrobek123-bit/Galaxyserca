# GalaxySerca - konfiguracja główna
# 1 serce = 2 punkty zdrowia (HP)

settings:
  min-withdraw-health: 10
  normal-limit: 30
  anarchic-limit: 40

hearts:
  normal:
    name: "&4&lDodatkowe serce"
    lore:
      - " &8» &7Kliknij PRAWYM, aby je wykorzystać!"
    custom-model-data: 1
  anarchic:
    name: "&4&lAnarchiczne serce"
    lore:
      - " &8» &7To &cserce &7możesz użyć poza limitem &c30 serc&7."
      - " &8» &7Maksymalnie możesz uzyskać &f40 serduszek&7!"
    custom-model-data: 4

death:
  enabled: true
  lightning: true
  lose-health: 1
  no-loss-below:
    enabled: true
    threshold: 30
  drop-heart: true
  ban-command: "tempban %player% 12h Brak serc!"
  reset-health-after-ban: 10

sounds:
  success: "entity.villager.celebrate"
  fail: "entity.villager.no"

messages:
  prefix: "&8[&bGalaxySerca&8] "
  only-player: "&cTa komenda jest tylko dla graczy!"
  no-permission: "&cNie masz permisji!"
  reloaded: "&aPrzeładowano konfigurację!"
  usage-give: "&cUżycie: /galaxyserca-give <normal|anarchic> [ilosc] [gracz]"
  player-not-found: "&cNie znaleziono gracza!"
  given: "&aDano &f{amount}x {type} &adla &f{player}&a."
  withdraw-not-enough: "&cBrak wystarczającej ilości serc do wypłaty! &f(Minimum {min})"
  withdraw-no-space: "&cNie masz miejsca w ekwipunku!"
  withdraw-success: "&aWypłacono jedno serce!"
  heart-used: "&7Otrzymałeś &f+ 1 serce&7!"
  limit-reached: "&7Nie możesz tego używać! Limit serc wynosi &f{limit}"
  heart-blocked: "&cSerc nie można tu używać!"
  purchase-fail: "&cNie masz wystarczającej liczby serc!"
  purchase-error: "&cWystąpił błąd podczas zakupu!"
  purchase-success: "&aZakup zakończony pomyślnie!"

shop:
  title: "&8Sklep za serca"
  rows: 5
  footer:
    - ""
    - "&8» &7Koszt: &c{cost} &7serc(a)"
    - "&8» &eKliknij, aby zakupić!"
  
  decorations:
    border_1:
      material: GRAY_STAINED_GLASS_PANE
      slot: 0
      name: "&7"
    border_2:
      material: GRAY_STAINED_GLASS_PANE
      slot: 8
      name: "&7"
    border_3:
      material: GRAY_STAINED_GLASS_PANE
      slot: 36
      name: "&7"
    border_4:
      material: GRAY_STAINED_GLASS_PANE
      slot: 44
      name: "&7"

  back-button:
    enabled: true
    slot: 40
    command: ""
    item:
      material: BARRIER
      name: "&c&lZamknij"
      lore:
        - "&7Kliknij, aby zamknąć sklep."

  items:
    extra_heart:
      slot: 11
      type: "HEART"
      cost: 2
      display:
        material: RED_DYE
        name: "&4&lKup Dodatkowe Serce"
        lore:
          - "&7Wymieniaj serca zebrane z graczy"
          - "&7na dodatkowy punkt zdrowia!"
        custom-model-data: 1

    anarchic_heart:
      slot: 15
      type: "ANARCHIC_HEART"
      cost: 5
      display:
        material: RED_DYE
        name: "&4&lKup Anarchiczne Serce"
        lore:
          - "&7Pozwala przekroczyć standardowy"
          - "&7limit 30 serc na serwerze!"
        custom-model-data: 4

    netherite_apple:
      slot: 22
      type: "ITEM"
      cost: 3
      item:
        material: ENCHANTED_GOLDEN_APPLE
        amount: 1
        name: "&d&lZłote Jabłko (God Apple)"
        lore:
          - "&7Potężny przedmiot ułatwiający pvp."
